[package]
name = "mf"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mf"
path = "src/main.rs"

[dependencies]
mf-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cli_benchmarks"
harness = false