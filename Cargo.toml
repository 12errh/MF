[workspace]
resolver = "2"
members = ["crates/mf-core", "crates/mf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mf-core = { path = "crates/mf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

[profile.release]
lto = true